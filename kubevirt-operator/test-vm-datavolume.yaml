apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: test-vm-arm64-datavolume
  namespace: prod-kubevirt-system
spec:
  running: false
  dataVolumeTemplates:
    - metadata:
        name: cirros-dv
      spec:
        storage:
          resources:
            requests:
              storage: 1Gi
        source:
          http:
            url: https://download.cirros-cloud.net/0.6.2/cirros-0.6.2-aarch64-disk.img
  template:
    metadata:
      labels:
        kubevirt.io/vm: test-vm-arm64-datavolume
    spec:
      domain:
        cpu:
          cores: 1
        devices:
          disks:
            - disk:
                bus: virtio
              name: datavolumedisk
            - disk:
                bus: virtio
              name: cloudinitdisk
        machine:
          type: virt
        resources:
          requests:
            memory: 512Mi
      nodeSelector:
        kubernetes.io/arch: arm64
      volumes:
        - dataVolume:
            name: cirros-dv
          name: datavolumedisk
        - cloudInitNoCloud:
            userData: |
              #cloud-config
              password: cirros
              chpasswd: { expire: False }
              ssh_pwauth: True
          name: cloudinitdisk
